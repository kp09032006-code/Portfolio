  <text x="760" y="582" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Automated Daily KPI &amp; SLA Alert Engine</text>
  <text x="760" y="604" fill="#94a3b8" font-family="sans-serif" font-size="11">Eliminated 4.5 hours of weekly manual reporting across sales teams.</text>
