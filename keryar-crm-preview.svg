  <text x="760" y="426" fill="#94a3b8" font-family="sans-serif" font-size="11">480 Leads • 24.8% Conversion • ₹1.4 Cr Value</text>
  <text x="1130" y="414" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="end">Volume</text>

  <rect x="742" y="454" width="410" height="66" rx="8" fill="#0d1424" stroke="#1e293b" stroke-width="1" />
  <text x="760" y="480" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Enterprise Referrals &amp; B2B Partners</text>
  <text x="760" y="504" fill="#94a3b8" font-family="sans-serif" font-size="11">240 Leads • 41.5% Conversion • ₹1.1 Cr Value</text>
  <text x="1130" y="492" fill="#a78bfa" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="end">High Win</text>

