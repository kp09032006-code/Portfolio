  <text x="760" y="348" fill="#94a3b8" font-family="sans-serif" font-size="11">520 Leads • 34.2% Conversion • ₹2.1 Cr Value</text>
  <text x="1130" y="336" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="end">Top ROI</text>

  <rect x="742" y="376" width="410" height="66" rx="8" fill="#0d1424" stroke="#1e293b" stroke-width="1" />
